[theme]
# Institutional terminal palette. These drive Streamlit's NATIVE widgets
# (buttons, selects, sidebar, links). The richer CSS overrides live in
# dashboard/_theme.py — keep both in sync with the token table at its top.
base = "dark"

# Restrained brushed teal (primary accent).
primaryColor = "#37b8aa"

# Deep graphite canvas (not pure black — avoids OLED bleed).
backgroundColor = "#0a0d13"

# Layered panel surface — slightly elevated off the background.
secondaryBackgroundColor = "#111620"

# Soft off-white primary text.
textColor = "#eaecf0"

font = "sans serif"

[server]
port = 8501
headless = true
# Bind to loopback only — prevents accidental LAN exposure of the portfolio
# and the kill-switch control. Do NOT change to 0.0.0.0 on a shared network.
address = "127.0.0.1"
