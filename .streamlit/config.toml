[theme]
# "Midnight" violet/cyan palette. These drive Streamlit's NATIVE widgets
# (buttons, selects, sidebar, links). The richer CSS overrides live in
# dashboard/_theme.py — keep both in sync with the token table at its top.
base = "dark"

# Electric violet (primary accent — start of the violet→cyan gradient).
primaryColor = "#7c5cff"

# Blue-black canvas (not pure black — avoids OLED bleed, gives depth).
backgroundColor = "#0b0c14"

# Layered panel surface — slightly elevated off the background.
secondaryBackgroundColor = "#141622"

# Near-white primary text.
textColor = "#eef0f6"

font = "sans serif"

[server]
port = 8501
headless = true
# Bind to loopback only — prevents accidental LAN exposure of the portfolio
# and the kill-switch control. Do NOT change to 0.0.0.0 on a shared network.
address = "127.0.0.1"
